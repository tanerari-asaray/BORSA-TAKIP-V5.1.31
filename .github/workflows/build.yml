name: V5.1.31 VIOP APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakip-V5.1.31-VIOP-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v5.1.31-viop-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk --title "Borsa Takip V5.1.31 VİOP APK" --notes "VİOP dashboard tasarım sürümü. Debug APK." --target "${{ github.sha }}"
